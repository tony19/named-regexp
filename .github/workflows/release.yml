name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3). Leave blank to bump the patch version of the latest release.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    name: Release
    # Only release from the default branch (not from tags or other branches)
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          # main is protected; a token that may bypass protection can be
          # provided via the RELEASE_TOKEN secret.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'maven'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compute version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Releases were previously tagged "named-regexp-X.Y.Z" (by the
          # maven-release-plugin), and are now tagged "vX.Y.Z".
          prev_tag=$(git tag --list 'v[0-9]*' 'named-regexp-[0-9]*' \
            | grep -E '^(v|named-regexp-)[0-9]+\.[0-9]+\.[0-9]+$' \
            | awk '{ v = $0; sub(/^(v|named-regexp-)/, "", v); print v " " $0 }' \
            | sort -V -k1,1 | tail -n 1 | cut -d' ' -f2)
          if [ -z "$prev_tag" ]; then
            echo "::error::No previous release tag found"
            exit 1
          fi
          prev_version=${prev_tag#v}
          prev_version=${prev_version#named-regexp-}

          if [ -n "$INPUT_VERSION" ]; then
            version=${INPUT_VERSION#v}
          else
            IFS=. read -r major minor patch <<< "$prev_version"
            version="$major.$minor.$((patch + 1))"
          fi

          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$version' (expected X.Y.Z)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$prev_version" "$version" | sort -V | tail -n 1)" != "$version" ] \
            || [ "$prev_version" = "$version" ]; then
            echo "::error::Version $version must be greater than the latest release ($prev_version)"
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$version"
          next_version="$major.$minor.$((patch + 1))-SNAPSHOT"

          echo "Releasing $version (previous: $prev_tag, next: $next_version)"
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prev_tag=$prev_tag"
            echo "next_version=$next_version"
          } >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Bump version to ${{ steps.version.outputs.version }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.23.0:set \
            -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          sed -i -E \
            -e "s/(com\.github\.tony19:named-regexp:)[0-9]+\.[0-9]+\.[0-9]+/\1$VERSION/" \
            -e "/<artifactId>named-regexp<\/artifactId>/{n;s/<version>[^<]*<\/version>/<version>$VERSION<\/version>/}" \
            README.md
          git diff
          mvn -B -ntp verify -Dgpg.skip
          git commit -am "chore(release): $TAG"
          git tag -a "$TAG" -m "$TAG"

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
        run: |
          cat > "$RUNNER_TEMP/context.json" <<EOF
          {
            "version": "$VERSION",
            "currentTag": "$TAG",
            "previousTag": "$PREV_TAG",
            "host": "${GITHUB_SERVER_URL}",
            "owner": "${GITHUB_REPOSITORY_OWNER}",
            "repository": "${GITHUB_REPOSITORY#*/}",
            "linkCompare": true
          }
          EOF
          npx -y \
            -p conventional-changelog@8.1.3 \
            -p conventional-changelog-conventionalcommits@10.4.1 \
            conventional-changelog -p conventionalcommits \
              --from "$PREV_TAG" --to "$TAG" \
              -c "$RUNNER_TEMP/context.json" --stdout \
            | sed '0,/^## /{/^## /d}' | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          # (The version heading is dropped since the release has its own title.)
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "_No notable changes._" > "$RUNNER_TEMP/notes.md"
          fi
          printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PREV_TAG" "$TAG" >> "$RUNNER_TEMP/notes.md"
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/notes.md"

      - name: Prepare next development version
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.23.0:set \
            -DnewVersion="$NEXT_VERSION" -DgenerateBackupPoms=false
          git commit -am "chore: prepare for next development iteration"

      - name: Push
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git push --atomic origin "HEAD:$GITHUB_REF_NAME" "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
